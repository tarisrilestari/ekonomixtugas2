<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Kegiatan Ekonomi - Ujian Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS untuk Tampilan Modern, Elegan, dan Responsif (Biru-Putih) */
        :root {
            --primary-color: #007bff; /* Biru cerah */
            --secondary-color: #f8f9fa; /* Putih lembut */
            --text-color: #333;
            --light-blue: #e9f5ff; /* Biru sangat muda untuk latar belakang */
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
            --transition-speed: 0.3s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--light-blue);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-container {
            width: 100%;
            max-width: 800px;
            background-color: var(--secondary-color);
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            padding: 30px;
            transition: var(--transition-speed);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--primary-color);
        }

        header h1 {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 1.8rem;
        }

        /* --- Layar Awal (Input Nama) --- */
        #start-screen {
            text-align: center;
            padding: 20px;
        }

        #start-screen h2 {
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        #student-name {
            width: 100%;
            padding: 12px;
            margin: 15px 0 25px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color var(--transition-speed);
        }

        #student-name:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .btn {
            display: inline-block;
            padding: 10px 25px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color var(--transition-speed), transform 0.1s;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }

        /* --- Tampilan Kuis Utama --- */
        #quiz-area {
            display: none;
        }

        #question-indicator {
            text-align: right;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .question-card {
            background-color: var(--secondary-color);
            padding: 25px;
            border-radius: 10px;
            box-shadow: var(--card-shadow);
            margin-bottom: 20px;
            min-height: 180px; /* Menjaga konsistensi tinggi saat transisi */
            transition: opacity var(--transition-speed), transform var(--transition-speed);
        }

        .question-card h3 {
            margin-bottom: 20px;
            font-size: 1.25rem;
            color: #212529;
            font-weight: 600;
        }

        .options-list {
            list-style: none;
        }

        .option-item {
            margin-bottom: 10px;
        }

        .option-label {
            display: block;
            background-color: var(--light-blue);
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color var(--transition-speed), box-shadow var(--transition-speed);
            border: 1px solid #d1e7ff;
            font-weight: 400;
        }

        .option-label:hover {
            background-color: #cce0ff;
            box-shadow: 0 2px 6px rgba(0, 123, 255, 0.2);
        }

        /* Menyembunyikan radio button bawaan */
        .option-radio {
            display: none;
        }

        /* Style saat opsi terpilih */
        .option-radio:checked + .option-label {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            font-weight: 600;
            box-shadow: 0 4px 8px rgba(0, 123, 255, 0.4);
        }

        .navigation-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        /* --- Layar Hasil/Selesai --- */
        #result-screen, #finished-message {
            text-align: center;
            padding: 40px 20px;
            border-radius: 10px;
            background-color: var(--secondary-color);
            box-shadow: var(--card-shadow);
        }

        #result-screen h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 2rem;
        }

        #score-display {
            font-size: 2.5rem;
            font-weight: 700;
            color: #28a745; /* Hijau untuk skor */
            display: block;
            margin-bottom: 15px;
        }

        #motivation-message {
            font-style: italic;
            color: #6c757d;
            margin-top: 15px;
            font-size: 1.1rem;
        }

        #finished-message h2 {
            color: #dc3545; /* Merah untuk pesan selesai */
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        /* --- Animasi Transisi (Fade In/Out) --- */
        .fade-out {
            opacity: 0;
            transform: translateY(10px);
        }
        
        .fade-in {
            opacity: 1;
            transform: translateY(0);
        }

        /* Responsif */
        @media (max-width: 600px) {
            .quiz-container {
                padding: 20px;
            }
            header h1 {
                font-size: 1.5rem;
            }
            .question-card h3 {
                font-size: 1.1rem;
            }
            .navigation-buttons {
                flex-direction: column;
            }
            .btn {
                width: 100%;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="quiz-container" id="main-container">

        <header>
            <h1>Kuis Kegiatan Ekonomi</h1>
            <p>Latihan Ujian Online</p>
        </header>

        <div id="finished-message" style="display: none;">
            <h2>Kamu sudah menyelesaikan kuis ini. Terima kasih!</h2>
            <p>Hasil kuis Anda sudah tersimpan. Silakan hubungi guru Anda untuk informasi lebih lanjut.</p>
            <button class="btn" id="download-results-btn" style="display: none; margin-top: 20px;">Download Hasil (Guru)</button>
        </div>

        <div id="start-screen">
            <h2>Selamat Datang!</h2>
            <p>Masukkan nama Anda untuk memulai kuis.</p>
            <input type="text" id="student-name" placeholder="Nama Lengkap Siswa" required>
            <button class="btn" id="start-quiz-btn" disabled>Mulai Kuis</button>
        </div>

        <div id="quiz-area" style="display: none;">
            <div id="question-indicator"></div>
            
            <div id="question-display" class="question-card fade-in">
                </div>

            <div class="navigation-buttons">
                <button class="btn" id="prev-btn" disabled>« Sebelumnya</button>
                <button class="btn" id="next-btn">Selanjutnya »</button>
                <button class="btn" id="submit-btn" style="display: none;">Kirim Jawaban</button>
            </div>
        </div>

        <div id="result-screen" style="display: none;">
            <h2>Hasil Kuis Anda!</h2>
            <p>Selamat, <span id="student-name-result" style="font-weight: 600;"></span></p>
            <span id="score-display"></span>
            <p id="time-taken-display"></p>
            <p id="motivation-message"></p>
            <button class="btn" id="download-results-btn-result" style="display: none; margin-top: 20px;">Download Hasil (Guru)</button>
        </div>

    </div>

    <script>
        // Data Soal Kuis
        const quizQuestions = [
            {
                question: "Kegiatan yang bertujuan untuk menambah nilai guna suatu barang atau menciptakan barang baru disebut sebagai kegiatan...",
                options: ["Konsumsi", "Distribusi", "Produksi", "Investasi", "Perdagangan"],
                answer: "Produksi"
            },
            {
                question: "Seseorang yang membeli pakaian di pasar untuk kebutuhan pribadinya dikategorikan sebagai pelaku kegiatan...",
                options: ["Produksi", "Distribusi", "Konsumsi", "Spekulasi", "Ekspor"],
                answer: "Konsumsi"
            },
            {
                question: "Contoh dari kegiatan distribusi secara langsung adalah...",
                options: ["Pedagang besar menjual barang ke pengecer", "Pabrik roti menjual rotinya melalui supermarket", "Petani menjual hasil panennya langsung ke konsumen di pasar", "Agen asuransi menawarkan produknya", "Importir menjual mobil ke dealer"],
                answer: "Petani menjual hasil panennya langsung ke konsumen di pasar"
            },
            {
                question: "Faktor produksi yang termasuk ke dalam sumber daya alam adalah...",
                options: ["Tenaga kerja dan modal", "Tanah, air, dan bahan mentah", "Keterampilan manajerial", "Mesin dan peralatan", "Uang tunai dan saham"],
                answer: "Tanah, air, dan bahan mentah"
            },
            {
                question: "Inti dari masalah ekonomi adalah...",
                options: ["Kenaikan harga barang pokok", "Kesenjangan antara si kaya dan si miskin", "Kebutuhan yang tidak terbatas dengan alat pemuas yang terbatas", "Tingginya angka pengangguran", "Perdagangan internasional yang tidak seimbang"],
                answer: "Kebutuhan yang tidak terbatas dengan alat pemuas yang terbatas"
            },
            {
                question: "Jenis produksi yang mengubah bentuk suatu barang (contoh: kayu menjadi meja) disebut...",
                options: ["Jasa", "Ekstraktif", "Agraris", "Industri", "Perdagangan"],
                answer: "Industri"
            },
            {
                question: "Dalam kegiatan ekonomi, pihak yang mengombinasikan faktor-faktor produksi untuk menghasilkan barang dan jasa adalah...",
                options: ["Pemerintah", "Rumah Tangga Konsumen (RTK)", "Rumah Tangga Produsen (RTP)", "Lembaga Keuangan", "Masyarakat Luar Negeri"],
                answer: "Rumah Tangga Produsen (RTP)"
            },
            {
                question: "Imbalan yang diterima oleh pemilik faktor produksi tanah (sumber daya alam) adalah...",
                options: ["Upah", "Bunga", "Laba", "Sewa", "Deviden"],
                answer: "Sewa"
            },
            {
                question: "Tujuan utama seorang produsen dalam menjalankan kegiatan produksi adalah...",
                options: ["Membantu masyarakat miskin", "Memenuhi kebutuhan negara", "Memperoleh keuntungan maksimal", "Menciptakan lapangan kerja", "Mendukung program pemerintah"],
                answer: "Memperoleh keuntungan maksimal"
            },
            {
                question: "Kegiatan menyalurkan barang dan jasa dari produsen ke konsumen disebut...",
                options: ["Produksi", "Konsumsi", "Distribusi", "Investasi", "Spekulasi"],
                answer: "Distribusi"
            },
            {
                question: "Pilihan jawaban (A, B, C, D, E) adalah representasi dari...",
                options: ["Opportunity Cost", "Kelangkaan", "Biaya Implisit", "Biaya Eksplisit", "Trade-off"],
                answer: "Trade-off"
            },
            {
                question: "Barang yang digunakan sebagai input dalam proses produksi (contoh: mesin pabrik) disebut barang...",
                options: ["Konsumsi", "Antara", "Modal", "Bebas", "Ekonomi"],
                answer: "Modal"
            },
            {
                question: "Motif ekonomi yang mendorong seseorang untuk bekerja keras adalah...",
                options: ["Mencari kepuasan", "Mendapatkan kekuasaan", "Mencapai kemakmuran", "Membantu sesama", "Mengikuti tren"],
                answer: "Mencapai kemakmuran"
            },
            {
                question: "Peran pemerintah dalam kegiatan ekonomi salah satunya adalah sebagai...",
                options: ["Distributor tunggal", "Produsen utama", "Konsumen dan regulator", "Investor asing", "Penentu harga pasar"],
                answer: "Konsumen dan regulator"
            },
            {
                question: "Contoh kegiatan konsumsi yang menghabiskan nilai guna barang sekaligus adalah...",
                options: ["Memakai baju baru", "Membaca buku", "Makan kue", "Menonton film", "Mendengarkan musik"],
                answer: "Makan kue"
            },
            {
                question: "Kegiatan ekonomi yang berkaitan dengan penanaman modal untuk memperoleh keuntungan di masa depan adalah...",
                options: ["Konsumsi", "Distribusi", "Investasi", "Spekulasi", "Ekspor"],
                answer: "Investasi"
            },
            {
                question: "Faktor yang paling menentukan keberhasilan seorang wirausaha adalah...",
                options: ["Jumlah modal yang besar", "Lokasi usaha yang strategis", "Ketersediaan tenaga kerja", "Keunggulan teknologi", "Keahlian (Skill) dan Keberanian mengambil risiko"],
                answer: "Keahlian (Skill) dan Keberanian mengambil risiko"
            },
            {
                question: "Apa yang dimaksud dengan kelangkaan (scarcity) dalam ilmu ekonomi?",
                options: ["Harga barang naik terus-menerus", "Jumlah uang yang beredar sedikit", "Tidak cukup sumber daya untuk memenuhi semua kebutuhan", "Banyaknya barang yang tidak laku di pasar", "Sangat sedikitnya pilihan barang yang tersedia"],
                answer: "Tidak cukup sumber daya untuk memenuhi semua kebutuhan"
            },
            {
                question: "Sistem ekonomi di mana pemerintah memiliki peran dominan dalam mengatur kegiatan ekonomi disebut sistem ekonomi...",
                options: ["Pasar", "Campuran", "Tradisional", "Komando", "Global"],
                answer: "Komando"
            },
            {
                question: "Penyedia faktor produksi (tanah, tenaga kerja, modal, keahlian) dalam Circular Flow Diagram adalah...",
                options: ["Rumah Tangga Konsumen (RTK)", "Rumah Tangga Produsen (RTP)", "Pemerintah", "Lembaga Keuangan", "Masyarakat Luar Negeri"],
                answer: "Rumah Tangga Konsumen (RTK)"
            },
            {
                question: "Pengertian dari 'What' dalam tiga masalah pokok ekonomi adalah...",
                options: ["Siapa yang akan memproduksi", "Bagaimana cara memproduksi", "Apa yang akan diproduksi", "Kapan produksi dilakukan", "Di mana produksi akan dijual"],
                answer: "Apa yang akan diproduksi"
            },
            {
                question: "Orang atau lembaga yang melaksanakan kegiatan distribusi disebut...",
                options: ["Konsumen", "Produsen", "Distributor", "Investor", "Spekulan"],
                answer: "Distributor"
            },
            {
                question: "Pihak yang menerima upah/gaji sebagai imbalan atas faktor produksi tenaga kerja adalah...",
                options: ["Pemilik modal", "Manajer perusahaan", "Pemerintah", "Rumah Tangga Konsumen (RTK)", "Rumah Tangga Produsen (RTP)"],
                answer: "Rumah Tangga Konsumen (RTK)"
            },
            {
                question: "Kegiatan ekonomi yang mencakup ekspor dan impor barang disebut...",
                options: ["Kegiatan domestik", "Kegiatan moneter", "Kegiatan sektor riil", "Kegiatan luar negeri (Perdagangan Internasional)", "Kegiatan fiskal"],
                answer: "Kegiatan luar negeri (Perdagangan Internasional)"
            },
            {
                question: "Keputusan untuk menunda konsumsi saat ini demi meningkatkan kemampuan konsumsi di masa depan adalah inti dari konsep...",
                options: ["Produksi", "Investasi", "Spekulasi", "Trade-off", "Opportunity Cost"],
                answer: "Investasi"
            }
        ];

        // Variabel Global
        let currentQuestionIndex = 0;
        let studentAnswers = []; // Array untuk menyimpan jawaban siswa
        let quizStartTime;
        let quizCompleted = false;
        const totalQuestions = quizQuestions.length;
        const MAX_SCORE = 100;
        const KEY_ANSWERS = 'quiz_student_answers';
        const KEY_SESSIONS = 'quiz_completed_sessions';
        const KEY_COMPLETED_STATUS = 'quiz_is_finished';

        // Element DOM
        const mainContainer = document.getElementById('main-container');
        const startScreen = document.getElementById('start-screen');
        const studentNameInput = document.getElementById('student-name');
        const startQuizBtn = document.getElementById('start-quiz-btn');
        const quizArea = document.getElementById('quiz-area');
        const questionDisplay = document.getElementById('question-display');
        const indicator = document.getElementById('question-indicator');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const submitBtn = document.getElementById('submit-btn');
        const resultScreen = document.getElementById('result-screen');
        const scoreDisplay = document.getElementById('score-display');
        const studentNameResult = document.getElementById('student-name-result');
        const timeTakenDisplay = document.getElementById('time-taken-display');
        const motivationMessage = document.getElementById('motivation-message');
        const finishedMessage = document.getElementById('finished-message');
        const downloadResultsBtn = document.getElementById('download-results-btn');
        const downloadResultsBtnResult = document.getElementById('download-results-btn-result');

        // Fungsi Inisialisasi Kuis
        function initQuiz() {
            // Cek apakah kuis sudah selesai pada sesi ini
            quizCompleted = localStorage.getItem(KEY_COMPLETED_STATUS) === 'true';

            // Tampilkan pesan selesai jika kuis sudah dikerjakan
            if (quizCompleted) {
                showFinishedMessage();
                return;
            }

            // Inisialisasi studentAnswers dari localStorage jika ada, atau buat array kosong
            const savedAnswers = localStorage.getItem(KEY_ANSWERS);
            if (savedAnswers) {
                studentAnswers = JSON.parse(savedAnswers);
            } else {
                studentAnswers = new Array(totalQuestions).fill(null);
            }

            // Event listener untuk validasi nama siswa
            studentNameInput.addEventListener('input', () => {
                startQuizBtn.disabled = studentNameInput.value.trim() === '';
            });

            startQuizBtn.addEventListener('click', startQuiz);
            prevBtn.addEventListener('click', () => changeQuestion(-1));
            nextBtn.addEventListener('click', () => changeQuestion(1));
            submitBtn.addEventListener('click', handleSubmitQuiz);
            
            // Tambahkan event listener untuk tombol download (hanya untuk simulasi guru)
            downloadResultsBtn.addEventListener('click', downloadResultsCSV);
            downloadResultsBtnResult.addEventListener('click', downloadResultsCSV);
        }

        // --- Alur Kuis ---

        // Fungsi untuk memulai kuis
        function startQuiz() {
            const studentName = studentNameInput.value.trim();
            if (!studentName) return;

            // Simpan nama siswa di localStorage untuk hasil
            localStorage.setItem('student_name', studentName);
            
            // Catat waktu mulai
            quizStartTime = new Date();
            localStorage.setItem('quiz_start_time', quizStartTime.toISOString());

            startScreen.style.display = 'none';
            quizArea.style.display = 'block';
            
            loadQuestion(currentQuestionIndex);
        }

        // Fungsi untuk memuat dan menampilkan soal
        function loadQuestion(index) {
            if (index < 0 || index >= totalQuestions) return;

            // Animasi Transisi (Fade Out)
            questionDisplay.classList.remove('fade-in');
            questionDisplay.classList.add('fade-out');
            
            setTimeout(() => {
                currentQuestionIndex = index;
                const questionData = quizQuestions[index];
                const questionNumber = index + 1;

                indicator.textContent = `${questionNumber} dari ${totalQuestions}`;

                let optionsHTML = '<ul class="options-list">';
                const optionLetters = ['A', 'B', 'C', 'D', 'E'];

                questionData.options.forEach((option, i) => {
                    const optionId = `q${index}-opt${i}`;
                    const isChecked = studentAnswers[index] === option;
                    
                    optionsHTML += `
                        <li class="option-item">
                            <input type="radio" id="${optionId}" name="question-${index}" class="option-radio" value="${option}" ${isChecked ? 'checked' : ''} 
                                onclick="handleAnswerSelection(${index}, '${option.replace(/'/g, "\\'")}')">
                            <label for="${optionId}" class="option-label">
                                <strong>${optionLetters[i]}.</strong> ${option}
                            </label>
                        </li>
                    `;
                });
                optionsHTML += '</ul>';

                questionDisplay.innerHTML = `
                    <h3>${questionNumber}. ${questionData.question}</h3>
                    ${optionsHTML}
                `;

                // Update status tombol navigasi
                updateNavigationButtons();

                // Animasi Transisi (Fade In)
                questionDisplay.classList.remove('fade-out');
                questionDisplay.classList.add('fade-in');

            }, 300); // Durasi sesuai CSS transition-speed
        }

        // Fungsi untuk menyimpan jawaban siswa
        window.handleAnswerSelection = function(qIndex, answer) {
            // Gunakan JSON.parse(JSON.stringify(answer)) untuk deep copy jika diperlukan
            studentAnswers[qIndex] = answer;
            localStorage.setItem(KEY_ANSWERS, JSON.stringify(studentAnswers));
        };

        // Fungsi untuk berpindah soal
        function changeQuestion(step) {
            const newIndex = currentQuestionIndex + step;
            if (newIndex >= 0 && newIndex < totalQuestions) {
                loadQuestion(newIndex);
            }
        }

        // Fungsi untuk memperbarui status tombol navigasi
        function updateNavigationButtons() {
            prevBtn.disabled = currentQuestionIndex === 0;
            nextBtn.style.display = currentQuestionIndex < totalQuestions - 1 ? 'inline-block' : 'none';
            submitBtn.style.display = currentQuestionIndex === totalQuestions - 1 ? 'inline-block' : 'none';

            // Tombol 'Selanjutnya' dinonaktifkan jika soal belum dijawab
            // if (currentQuestionIndex < totalQuestions - 1) {
            //     nextBtn.disabled = studentAnswers[currentQuestionIndex] === null;
            // }
        }

        // Fungsi untuk menghitung skor dan menampilkan hasil
        function handleSubmitQuiz() {
            // Cek apakah semua soal sudah dijawab (opsional, tapi disarankan)
            const unanswered = studentAnswers.filter(a => a === null).length;
            if (unanswered > 0) {
                if (!confirm(`Terdapat ${unanswered} soal yang belum dijawab. Yakin ingin mengirim jawaban?`)) {
                    return;
                }
            }

            quizArea.style.display = 'none';
            resultScreen.style.display = 'block';

            // --- Penilaian Otomatis ---
            let correctCount = 0;
            studentAnswers.forEach((answer, index) => {
                if (answer === quizQuestions[index].answer) {
                    correctCount++;
                }
            });

            const score = Math.round((correctCount / totalQuestions) * MAX_SCORE);
            const studentName = localStorage.getItem('student_name') || 'Siswa';
            
            // Catat waktu selesai
            const quizEndTime = new Date();
            const startTime = new Date(localStorage.getItem('quiz_start_time'));
            const timeDiff = quizEndTime.getTime() - startTime.getTime();
            const timeTaken = formatTime(timeDiff);

            // Tampilkan hasil
            studentNameResult.textContent = studentName;
            scoreDisplay.textContent = `${score} dari ${MAX_SCORE}`;
            timeTakenDisplay.textContent = `Waktu pengerjaan: ${timeTaken}`;
            motivationMessage.textContent = score >= 70 ? "Kerja bagus! Terus tingkatkan kemampuanmu 💪" : "Terus semangat belajar, hasil akan mengikuti usahamu! 👍";

            // Simpan status kuis selesai
            quizCompleted = true;
            localStorage.setItem(KEY_COMPLETED_STATUS, 'true');

            // --- Simpan Hasil dalam Format CSV ---
            const quizResult = {
                nama: studentName,
                skor: score,
                waktuSelesai: timeTaken,
                tanggal: quizEndTime.toLocaleDateString('id-ID'),
                timestamp: quizEndTime.toISOString()
            };
            
            saveResultToLocalStorage(quizResult);

            // Nonaktifkan tombol untuk mencegah pengiriman ganda
            startQuizBtn.disabled = true;
            submitBtn.disabled = true;

            // Tampilkan tombol download hasil di layar hasil
            downloadResultsBtnResult.style.display = 'inline-block';
        }

        // Fungsi untuk menampilkan pesan sudah selesai
        function showFinishedMessage() {
            startScreen.style.display = 'none';
            quizArea.style.display = 'none';
            resultScreen.style.display = 'none';
            finishedMessage.style.display = 'block';

            // Tampilkan tombol download hasil di layar selesai
            downloadResultsBtn.style.display = 'inline-block';
        }

        // --- Penyimpanan dan Download CSV ---

        // Fungsi untuk menyimpan hasil ke localStorage
        function saveResultToLocalStorage(result) {
            let sessions = JSON.parse(localStorage.getItem(KEY_SESSIONS) || '[]');
            sessions.push(result);
            localStorage.setItem(KEY_SESSIONS, JSON.stringify(sessions));
        }

        // Fungsi utilitas untuk format waktu
        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${minutes} menit ${seconds} detik`;
        }

        // Fungsi untuk simulasi download CSV
        function downloadResultsCSV() {
            const sessions = JSON.parse(localStorage.getItem(KEY_SESSIONS) || '[]');
            
            if (sessions.length === 0) {
                alert("Belum ada data hasil kuis yang tersimpan.");
                return;
            }

            // Header CSV
            let csvContent = "Nama,Skor,Waktu Selesai,Tanggal\n";

            // Isi CSV
            sessions.forEach(session => {
                csvContent += `${session.nama},${session.skor},"${session.waktuSelesai}",${session.tanggal}\n`;
            });

            // Membuat Blob dan URL untuk download
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            
            link.setAttribute("href", url);
            link.setAttribute("download", "hasil_kuis_kegiatan_ekonomi.csv");
            link.style.visibility = 'hidden'; // Sembunyikan link
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            alert(`File hasil kuis (${sessions.length} sesi) berhasil diunduh!`);
        }

        // Mulai aplikasi
        document.addEventListener('DOMContentLoaded', initQuiz);
    </script>

</body>
</html>
